<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Scale group: 20% larger, centered -->
  <g transform="translate(128,128) scale(1.3) translate(-128,-128)">
    <!-- Circuit traces -->
    <g stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="40" y1="128" x2="80" y2="128"/>
      <line x1="80" y1="128" x2="80" y2="80"/>
      <line x1="80" y1="80" x2="128" y2="80"/>
      <line x1="176" y1="128" x2="216" y2="128"/>
      <line x1="176" y1="128" x2="176" y2="176"/>
      <line x1="176" y1="176" x2="128" y2="176"/>
      <line x1="80" y1="128" x2="80" y2="176"/>
      <line x1="80" y1="176" x2="108" y2="176"/>
      <line x1="176" y1="128" x2="176" y2="80"/>
      <line x1="176" y1="80" x2="148" y2="80"/>
    </g>
    <!-- Center chip body -->
    <rect x="96" y="96" width="64" height="64" rx="6" fill="#2d2d2d" stroke="#4a4a4a" stroke-width="2"/>
    <!-- Chip notch -->
    <circle cx="128" cy="160" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <!-- Pin dots on chip -->
    <circle cx="96" cy="112" r="4" fill="#94a3b8"/>
    <circle cx="96" cy="128" r="4" fill="#94a3b8"/>
    <circle cx="96" cy="144" r="4" fill="#94a3b8"/>
    <circle cx="160" cy="112" r="4" fill="#94a3b8"/>
    <circle cx="160" cy="128" r="4" fill="#94a3b8"/>
    <circle cx="160" cy="144" r="4" fill="#94a3b8"/>
    <!-- LED glow -->
    <circle cx="208" cy="72" r="18" fill="#4ade80" opacity="0.15"/>
    <circle cx="208" cy="72" r="10" fill="#4ade80" opacity="0.3"/>
    <circle cx="208" cy="72" r="5" fill="url(#glow)"/>
    <!-- E101 text -->
    <text x="128" y="132" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#e2e8f0">E101</text>
    <!-- Trace node dots -->
    <circle cx="80" cy="128" r="3" fill="#60a5fa"/>
    <circle cx="176" cy="128" r="3" fill="#60a5fa"/>
    <circle cx="80" cy="80" r="3" fill="#60a5fa"/>
    <circle cx="176" cy="80" r="3" fill="#60a5fa"/>
    <circle cx="80" cy="176" r="3" fill="#60a5fa"/>
    <circle cx="176" cy="176" r="3" fill="#60a5fa"/>
  </g>
</svg>
